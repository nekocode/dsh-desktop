[package]
name = "dsh-desktop"
version = "0.1.0"
description = "Minimal DeepSeek Harness desktop app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_desktop_lib"
# `rlib` only. Tauri's template also emits `staticlib`/`cdylib` for iOS/Android, which this project
# does not build — and on `x86_64-pc-windows-msvc` a `cdylib` cannot be linked against the static
# CRT (`libcmt.lib` and `libvcruntime.lib` collide on `abort`/`operator delete`), so keeping the two
# unused outputs would cost the Windows build its freedom from the VC++ redistributable.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
# Only the timer is used: the startup watchdog needs to sleep inside async.
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
